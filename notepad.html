<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Note Pad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f7f7f7;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }
    .dark-mode {
      background: #121212;
      color: #f1f1f1;
    }
    #login, #pad, #noteList, #importExport, #trash, #aiSuggestions, #settings {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .dark-mode #login, .dark-mode #pad, .dark-mode #noteList, .dark-mode #importExport, .dark-mode #trash, .dark-mode #aiSuggestions, .dark-mode #settings {
      background: #1e1e1e;
      color: #f1f1f1;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      border-radius: 8px;
      resize: vertical;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
    }
    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-save { background: #4CAF50; }
    .btn-delete { background: #e74c3c; }
    .btn-copy { background: #3498db; }
    .btn-dark { background: #555; }
    .plus-icon {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #4CAF50;
      font-size: 28px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      line-height: 55px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      text-decoration: none;
      color: white;
    }
    .note-entry {
      text-align: left;
      background: #efefef;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>  <div id="login">
    <h2>Login to Access Notes</h2>
    <input type="text" id="phone" placeholder="Enter your phone number" />
    <button onclick="login()">Login</button>
  </div>  <div id="noteList" style="display: none;">
    <h2>My Notes</h2>
    <input type="text" id="search" placeholder="Search notes..." onkeyup="filterNotes()" />
    <div id="notes"></div>
  </div>  <div id="pad" style="display: none;">
    <h2 id="padTitle">New Note</h2>
    <input type="text" id="title" placeholder="Note title" />
    <select id="category">
      <option value="">Select Category</option>
      <option value="Personal">Personal</option>
      <option value="Work">Work</option>
      <option value="Idea">Idea</option>
    </select>
    <textarea id="note" placeholder="Type your note here..."></textarea>
    <br>
    <button class="btn-save" onclick="saveNote()">Save</button>
    <button class="btn-delete" onclick="deleteNote()">Delete</button>
    <button class="btn-copy" onclick="copyNote()">Copy</button>
    <button class="btn-dark" onclick="toggleDarkMode()">Dark Mode</button>
    <button onclick="backToList()">✘ Back</button>
  </div>  <div id="importExport" style="display: none;">
    <h2>📥 Import / Export Notes</h2>
    <button onclick="exportNotes()">Export Notes</button>
    <input type="file" onchange="importNotes(event)" />
    <button onclick="backToList()">✘ Back</button>
  </div>  <div id="trash" style="display: none;">
    <h2>🗑️ Trash</h2>
    <div id="trashList"></div>
    <button onclick="backToList()">✘ Back</button>
  </div>  <div id="aiSuggestions" style="display: none;">
    <h2>🤖 AI Note Suggestions</h2>
    <div id="aiNotes"></div>
    <button onclick="backToList()">✘ Back</button>
  </div>  <div id="settings" style="display: none;">
    <h2>⚙️ Settings</h2>
    <p>Additional features will be added soon.</p>
    <button onclick="backToList()">✘ Back</button>
  </div><a class="plus-icon" onclick="createNewNote()">+</a>

  <script>
    let notes = JSON.parse(localStorage.getItem('notes')) || [];
    let currentNoteId = null;

    function login() {
      const phone = document.getElementById('phone').value;
      if (phone.length >= 6) {
        localStorage.setItem('loggedIn', 'true');
        document.getElementById('login').style.display = 'none';
        showNoteList();
      } else {
        alert('Invalid number');
      }
    }

    function showNoteList() {
      document.getElementById('noteList').style.display = 'block';
      document.getElementById('pad').style.display = 'none';
      document.getElementById('importExport').style.display = 'none';
      document.getElementById('trash').style.display = 'none';
      document.getElementById('aiSuggestions').style.display = 'none';
      document.getElementById('settings').style.display = 'none';
      renderNotes();
    }

    function renderNotes() {
      const container = document.getElementById('notes');
      container.innerHTML = '';
      notes.forEach((note, i) => {
        const div = document.createElement('div');
        div.className = 'note-entry';
        div.innerHTML = `<strong>${note.title}</strong><br>${note.category}<br>${note.date}`;
        div.onclick = () => openNote(i);
        container.appendChild(div);
      });
    }

    function createNewNote() {
      currentNoteId = null;
      document.getElementById('title').value = '';
      document.getElementById('category').value = '';
      document.getElementById('note').value = '';
      document.getElementById('padTitle').innerText = 'New Note';
      document.getElementById('noteList').style.display = 'none';
      document.getElementById('pad').style.display = 'block';
    }

    function openNote(index) {
      currentNoteId = index;
      const note = notes[index];
      document.getElementById('title').value = note.title;
      document.getElementById('category').value = note.category;
      document.getElementById('note').value = note.content;
      document.getElementById('padTitle').innerText = note.title;
      document.getElementById('noteList').style.display = 'none';
      document.getElementById('pad').style.display = 'block';
    }

    function saveNote() {
      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value;
      const content = document.getElementById('note').value;
      const date = new Date().toLocaleString();

      if (!title || !content) return alert('Title and note required');

      const newNote = { title, content, category, date };
      if (currentNoteId !== null) {
        notes[currentNoteId] = newNote;
      } else {
        notes.push(newNote);
      }
      localStorage.setItem('notes', JSON.stringify(notes));
      alert('Note saved!');
      showNoteList();
    }

    function deleteNote() {
      if (currentNoteId !== null && confirm('Delete this note?')) {
        notes.splice(currentNoteId, 1);
        localStorage.setItem('notes', JSON.stringify(notes));
        showNoteList();
      }
    }

    function copyNote() {
      const text = document.getElementById('note');
      text.select();
      document.execCommand('copy');
      alert('Copied!');
    }

    function filterNotes() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = notes.filter(note => note.title.toLowerCase().includes(query) || note.category.toLowerCase().includes(query));
      const container = document.getElementById('notes');
      container.innerHTML = '';
      filtered.forEach((note, i) => {
        const div = document.createElement('div');
        div.className = 'note-entry';
        div.innerHTML = `<strong>${note.title}</strong><br>${note.category}<br>${note.date}`;
        div.onclick = () => openNote(notes.indexOf(note));
        container.appendChild(div);
      });
    }

    function backToList() {
      showNoteList();
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    function exportNotes() {
      const blob = new Blob([JSON.stringify(notes)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'notes.json';
      a.click();
    }

    function importNotes(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const imported = JSON.parse(e.target.result);
            notes = imported;
            localStorage.setItem('notes', JSON.stringify(notes));
            showNoteList();
          } catch (err) {
            alert('Invalid file format');
          }
        };
        reader.readAsText(file);
      }
    }

    window.onload = function () {
      if (localStorage.getItem('loggedIn') === 'true') {
        document.getElementById('login').style.display = 'none';
        showNoteList();
      }
    };
  </script></body>
</html>
