<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Note Pad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }
    .dark-mode {
      background: #222;
      color: #fff;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .dark-toggle {
      cursor: pointer;
      font-size: 16px;
      background: #444;
      color: #fff;
      padding: 5px 10px;
      border: none;
      border-radius: 4px;
    }
    #login, #notepad {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .dark-mode #login, .dark-mode #notepad {
      background: #333;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 15px;
      margin-top: 10px;
      border: none;
      background: #4CAF50;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .danger { background: #e74c3c; }
    .copy { background: #3498db; }
    .plus-icon {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #4CAF50;
      color: white;
      font-size: 28px;
      border: none;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      text-align: center;
      line-height: 55px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .note-card {
      background: #f1f1f1;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .dark-mode .note-card {
      background: #444;
    }
  </style>
</head>
<body>

  <header>
    <h2>📓 Secure Note Pad</h2>
    <button class="dark-toggle" onclick="toggleDarkMode()">🌙</button>
  </header>

  <!-- Login Section -->
  <div id="login">
    <h3>Login</h3>
    <input type="text" id="phone" placeholder="Enter phone number">
    <button onclick="login()">Login</button>
  </div>

  <!-- Notepad Section -->
  <div id="notepad" style="display:none">
    <input type="text" id="title" placeholder="Note Title">
    <select id="category">
      <option value="General">General</option>
      <option value="Work">Work</option>
      <option value="Personal">Personal</option>
    </select>
    <textarea id="note" placeholder="Write your note here..."></textarea>
    <button onclick="saveNote()">Save</button>
    <button class="copy" onclick="copyNote()">Copy</button>
    <button class="danger" onclick="clearNote()">Clear</button>
    <h3>🔍 Search Notes</h3>
    <input type="text" id="search" oninput="renderNotes()" placeholder="Search by title or content">
    <div id="noteList"></div>
  </div>

  <!-- Plus Icon -->
  <button class="plus-icon" onclick="newNote()">+</button>

  <script>
    let notes = JSON.parse(localStorage.getItem('notes') || '[]');
    let currentIndex = -1;

    function login() {
      const phone = document.getElementById('phone').value.trim();
      if (phone.length >= 6) {
        localStorage.setItem('loggedIn', 'true');
        document.getElementById('login').style.display = 'none';
        document.getElementById('notepad').style.display = 'block';
        renderNotes();
      } else alert('Enter valid phone number');
    }

    function newNote() {
      document.getElementById('title').value = '';
      document.getElementById('note').value = '';
      document.getElementById('category').value = 'General';
      currentIndex = -1;
    }

    function saveNote() {
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('note').value;
      const category = document.getElementById('category').value;
      if (!title || !content) return alert('Title and content required');
      const noteData = { title, content, category, time: new Date().toLocaleString() };
      if (currentIndex === -1) notes.push(noteData);
      else notes[currentIndex] = noteData;
      localStorage.setItem('notes', JSON.stringify(notes));
      renderNotes();
      alert('Note saved!');
    }

    function renderNotes() {
      const list = document.getElementById('noteList');
      const search = document.getElementById('search').value.toLowerCase();
      list.innerHTML = '';
      notes.forEach((n, i) => {
        if (n.title.toLowerCase().includes(search) || n.content.toLowerCase().includes(search)) {
          const card = document.createElement('div');
          card.className = 'note-card';
          card.innerHTML = `
            <strong>${n.title}</strong> <em>(${n.category})</em><br>
            <small>${n.time}</small><br>
            <p>${n.content.slice(0, 100)}...</p>
            <button onclick="openNote(${i})">Open</button>
            <button class="danger" onclick="deleteNote(${i})">Delete</button>
          `;
          list.appendChild(card);
        }
      });
    }

    function openNote(i) {
      currentIndex = i;
      const note = notes[i];
      document.getElementById('title').value = note.title;
      document.getElementById('note').value = note.content;
      document.getElementById('category').value = note.category;
    }

    function deleteNote(i) {
      if (confirm('Delete this note?')) {
        notes.splice(i, 1);
        localStorage.setItem('notes', JSON.stringify(notes));
        renderNotes();
      }
    }

    function clearNote() {
      if (confirm('Clear current note?')) newNote();
    }

    function copyNote() {
      const note = document.getElementById('note');
      note.select();
      document.execCommand('copy');
      alert('Copied to clipboard!');
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    if (localStorage.getItem('loggedIn') === 'true') {
      document.getElementById('login').style.display = 'none';
      document.getElementById('notepad').style.display = 'block';
      renderNotes();
    }
  </script>
</body>
</html>
