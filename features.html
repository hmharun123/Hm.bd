<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সব ফিচার | মানিকগঞ্জের বড় মিয়া</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill/dist/quill.snow.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simplemde/dist/simplemde.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Hind Siliguri', sans-serif;
      background-color: #f4f4f4;
      color: #222;
    }
    header {
      background-color: #0d47a1;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .section {
      padding: 30px 20px;
      max-width: 960px;
      margin: auto;
    }
    .feature-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .feature {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
    }
    .feature-box {
      display: none;
      margin-top: 30px;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    textarea, .input, .output, .list ul {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .btn {
      background: #0d47a1;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .draggable {
      padding: 10px;
      background: #bbdefb;
      margin-bottom: 5px;
      cursor: move;
    }
    .quill, .editor-toolbar, .CodeMirror {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <header><h1>🌟 আমার সব ফিচারসমূহ (২৩টি)</h1></header>
  <div class="section">
    <div class="feature-list">
      <div class="feature" onclick="showBox('dark')">🌙 Dark Mode</div>
      <div class="feature" onclick="showBox('drag')">🔃 Drag Notes</div>
      <div class="feature" onclick="showBox('lock')">🔐 Password Lock</div>
      <div class="feature" onclick="showBox('timestamp')">🕓 Timestamp</div>
      <div class="feature" onclick="showBox('markdown')">📝 Markdown Editor</div>
      <div class="feature" onclick="showBox('richtext')">🅱️ Rich Text Editor</div>
      <div class="feature" onclick="showBox('cv')">📄 CV Viewer</div>
      <div class="feature" onclick="showBox('livechat')">💬 Live Chat</div>
      <div class="feature" onclick="showBox('clipboard')">📋 Copy</div>
      <div class="feature" onclick="showBox('pdfmerge')">📑 PDF Merge</div>
    </div>

    <div class="feature-box" id="dark">
      <button class="btn" onclick="document.body.classList.toggle('dark')">🌙 Toggle Dark Mode</button>
    </div>
    <div class="feature-box" id="drag">
      <div id="dragContainer">
        <div class="draggable" draggable="true">Note 1</div>
        <div class="draggable" draggable="true">Note 2</div>
      </div>
    </div>
    <div class="feature-box" id="lock">
      <input type="password" id="notePass"><button class="btn" onclick="unlockNote()">Unlock</button><p id="lockMsg"></p>
    </div>
    <div class="feature-box" id="timestamp">🕓 Created: <span id="createdAt"></span></div>
    <div class="feature-box" id="markdown">
      <textarea id="markdownEditor"></textarea>
    </div>
    <div class="feature-box" id="richtext">
      <div id="editor"></div>
    </div>
    <div class="feature-box" id="cv">
      <embed src="assets/Md_Harun_Or_Rashid_CV_Image.pdf" width="100%" height="500px" type="application/pdf">
    </div>
    <div class="feature-box" id="livechat">
      <iframe src="https://embed.tawk.to/6852e70485f8531915bbefad/1iu1tcr2f" width="100%" height="400" style="border:0;"></iframe>
    </div>
    <div class="feature-box" id="clipboard">
      <textarea id="copyText">এই লেখাটি কপি করুন</textarea>
      <button class="btn" onclick="copyToClipboard()">Copy</button>
    </div>
    <div class="feature-box" id="pdfmerge">
      <p>📄 দুইটি PDF মিশানোর ফিচার ভবিষ্যতে যুক্ত হবে।</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/simplemde/dist/simplemde.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill/dist/quill.min.js"></script>
  <script>
    function showBox(id) {
      document.querySelectorAll('.feature-box').forEach(e => e.style.display = 'none');
      document.getElementById(id).style.display = 'block';
    }
    function unlockNote() {
      const pass = document.getElementById('notePass').value;
      document.getElementById('lockMsg').textContent = pass === '1234' ? 'Unlocked ✅' : 'Wrong ❌';
    }
    function copyToClipboard() {
      const text = document.getElementById("copyText").value;
      navigator.clipboard.writeText(text).then(() => alert("Copied!"));
    }
    document.querySelectorAll('.draggable').forEach(el => {
      el.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', e.target.textContent);
      });
      el.addEventListener('dragover', e => e.preventDefault());
      el.addEventListener('drop', e => {
        e.preventDefault();
        const data = e.dataTransfer.getData('text');
        const dropTarget = e.target;
        const dragEl = Array.from(document.querySelectorAll('.draggable')).find(el => el.textContent === data);
        if (dragEl && dropTarget !== dragEl) {
          dropTarget.parentNode.insertBefore(dragEl, dropTarget);
        }
      });
    });
    const simplemde = new SimpleMDE({ element: document.getElementById("markdownEditor") });
    const quill = new Quill('#editor', { theme: 'snow' });
    window.onload = () => {
      document.getElementById('createdAt').textContent = new Date().toLocaleString();
    }
  </script>
</body>
</html>
