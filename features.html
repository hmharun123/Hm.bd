
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌟 আমার সব ফিচারসমূহ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f1f1f1;
      color: #111;
    }
    .container {
      max-width: 960px;
      margin: 30px auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 10px #ccc;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #0d47a1;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
    }
    .feature {
      padding: 15px;
      background: #e3f2fd;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }
    .feature:hover {
      background: #bbdefb;
    }
    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background: #0d47a1;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      margin-top: 10px;
      cursor: pointer;
    }
    .output {
      margin-top: 10px;
      background: #f9f9f9;
      padding: 10px;
      border-radius: 6px;
    }
    .hidden { display: none; }
    .dark { background: #121212; color: #f4f4f4; }
    .dark .feature { background: #2a2a2a; }
    .dark .feature:hover { background: #444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔥 আমার সব ফিচারসমূহ</h1>

    <div class="features">
      <div class="feature" onclick="toggleDarkMode()"><i class="fas fa-moon"></i><br>ডার্ক মোড</div>
      <div class="feature" onclick="copyToClipboard()"><i class="fas fa-copy"></i><br>কপি</div>
      <div class="feature" onclick="downloadAsPDF()"><i class="fas fa-file-pdf"></i><br>PDF ডাউনলোড</div>
      <div class="feature" onclick="saveNote()"><i class="fas fa-save"></i><br>সেভ</div>
      <div class="feature" onclick="loadNote()"><i class="fas fa-folder-open"></i><br>লোড</div>
      <div class="feature" onclick="clearNote()"><i class="fas fa-trash"></i><br>ক্লিয়ার</div>
      <div class="feature" onclick="exportText()"><i class="fas fa-file-alt"></i><br>TXT</div>
      <div class="feature" onclick="showPasswordLock()"><i class="fas fa-lock"></i><br>পাসওয়ার্ড লক</div>
      <div class="feature" onclick="showCV()"><i class="fas fa-id-card"></i><br>CV</div>
      <div class="feature" onclick="setReminder()"><i class="fas fa-bell"></i><br>রিমাইন্ডার</div>
      <div class="feature" onclick="chatDemo()"><i class="fas fa-comments"></i><br>লাইভ চ্যাট</div>
      <div class="feature" onclick="suggestAI()"><i class="fas fa-brain"></i><br>AI সাজেশন</div>
    </div>

    <textarea id="note" placeholder="✍️ এখানে নোট লিখুন..."></textarea>

    <div id="passwordBox" class="hidden">
      <input type="password" id="passInput" placeholder="🔐 পাসওয়ার্ড দিন">
      <button onclick="unlockNote()">Unlock</button>
      <div id="passStatus"></div>
    </div>

    <div class="output" id="outputBox"></div>
    <div style="margin-top: 10px;"><a href="assets/Md_Harun_Or_Rashid_CV_Image.pdf" download>📄 আমার সিভি ডাউনলোড করুন</a></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    function toggleDarkMode() {
      document.body.classList.toggle('dark');
    }

    function copyToClipboard() {
      const text = document.getElementById("note").value;
      navigator.clipboard.writeText(text).then(() => {
        alert("✅ কপি হয়েছে!");
      });
    }

    function downloadAsPDF() {
      html2pdf().from(document.getElementById("note")).save("note.pdf");
    }

    function exportText() {
      const text = document.getElementById("note").value;
      const blob = new Blob([text], {type: "text/plain"});
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "note.txt";
      link.click();
    }

    function saveNote() {
      const note = document.getElementById("note").value;
      localStorage.setItem("myNote", note);
      alert("✅ নোট সেভ হয়েছে!");
    }

    function loadNote() {
      const saved = localStorage.getItem("myNote");
      if (saved) {
        document.getElementById("note").value = saved;
        alert("📂 লোড সম্পন্ন!");
      } else {
        alert("❌ কোনো সেভ করা নোট নেই");
      }
    }

    function clearNote() {
      document.getElementById("note").value = "";
    }

    function showPasswordLock() {
      document.getElementById("passwordBox").classList.toggle("hidden");
    }

    function unlockNote() {
      const input = document.getElementById("passInput").value;
      const status = document.getElementById("passStatus");
      if (input === "1234") {
        status.innerText = "✅ আনলক হয়েছে!";
      } else {
        status.innerText = "❌ ভুল পাসওয়ার্ড!";
      }
    }

    function showCV() {
      window.open("assets/Md_Harun_Or_Rashid_CV_Image.pdf", "_blank");
    }

    function setReminder() {
      alert("⏰ রিমাইন্ডার ফিচার আসছে শীঘ্রই...");
    }

    function chatDemo() {
      alert("💬 লাইভ চ্যাট (Tawk.to যুক্ত হবে)");
    }

    function suggestAI() {
      const demo = ["আজকের কাজ: টিকটক ভিডিও রেকর্ড", "গ্রাহকের অর্ডার চেক", "সিভি আপডেট"];
      const random = demo[Math.floor(Math.random() * demo.length)];
      document.getElementById("outputBox").innerText = `🤖 AI সাজেশন: ${random}`;
    }
  </script>
</body>
</html>
